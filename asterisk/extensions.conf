[from-provider]
exten => s,1,Answer()
 same => n,Set(TIMEOUT(digit)=5)
 same => n,Set(TIMEOUT(response)=10)
 same => n,Playback(mazh/welcome)
 same => n,Read(PIN,mazh/enter-pin,6,,3,10)
 same => n,GotoIf($["${LEN(${PIN})}" != "6"]?invalid_pin,1)
 same => n,AGI(mazh_weather.py,weather,${PIN})
 same => n,GotoIf($["${MAZH_NOTFOUND}" = "1"]?invalid_pin,1)
 same => n,GotoIf($["${MAZH_OK}" != "1"]?backend_error,1)
 same => n,Set(MAZH_PIN=${PIN})
 same => n,GoSub(mazh-speak,s,1(${MAZH_MESSAGE}))
 same => n,Goto(from-provider,menu,1)

exten => invalid_pin,1,Playback(mazh/invalid-pin)
 same => n,Goto(s,1)

exten => backend_error,1,Playback(mazh/backend-error)
 same => n,Hangup()

exten => menu,1,Background(mazh/menu)
 same => n,WaitExten(8)
 same => n,Playback(mazh/no-input)
 same => n,Goto(from-provider,menu,1)

exten => 1,1,AGI(mazh_weather.py,today,${MAZH_PIN})
 same => n,GoSub(mazh-speak,s,1(${MAZH_MESSAGE}))
 same => n,Goto(from-provider,menu,1)

exten => 2,1,AGI(mazh_weather.py,tomorrow,${MAZH_PIN})
 same => n,GoSub(mazh-speak,s,1(${MAZH_MESSAGE}))
 same => n,Goto(from-provider,menu,1)

exten => 3,1,AGI(mazh_weather.py,alerts,${MAZH_PIN})
 same => n,GoSub(mazh-speak,s,1(${MAZH_MESSAGE}))
 same => n,Goto(from-provider,menu,1)

exten => 4,1,AGI(mazh_weather.py,sms,${MAZH_PIN},${CALLERID(num)})
 same => n,GotoIf($["${MAZH_OK}" != "1"]?backend_error,1)
 same => n,Playback(mazh/sms-sent)
 same => n,Goto(from-provider,menu,1)

exten => 9,1,Goto(s,1)
exten => 0,1,Playback(mazh/goodbye)
 same => n,Hangup()

exten => i,1,Playback(mazh/invalid-pin)
 same => n,Goto(from-provider,menu,1)
exten => t,1,Playback(mazh/goodbye)
 same => n,Hangup()

[mazh-speak]
exten => s,1,NoOp(Speaking Mazh response)
 same => n,GotoIf($["${MAZH_HAS_AUDIO}" = "1"]?playfile)
 same => n,Playback(mazh/backend-error)
 same => n,Return()
 same => n(playfile),Playback(${MAZH_AUDIO_FILE})
 same => n,Return()

; Test context for registered SIP clients (e.g. Linphone extension 1001).
; Overrides the old SayAlpha test on 601; 600 echo test stays in the main file.
[mazh-test]
exten => 601,1,Answer()
 same => n,NoOp(Mazh-AI weather API test)
 same => n,AGI(mazh_weather.py,weather,600001)
 same => n,NoOp(Mazh result: ${MAZH_OK} - ${MAZH_MESSAGE})
 same => n,GoSub(mazh-speak,s,1(${MAZH_MESSAGE}))
 same => n,Hangup()

exten => 602,1,Goto(from-provider,s,1)
